# metatomic tip after metatensor/gromacs#13 merge (sample_kind + 0.1.15 floors)
{% set git_rev = "30aa47d619b58f115d71630dd07fc5312510f1a6" %}
# increase this by 1 everytime you change the git commit above without also
# changing the `version`
{% set git_rev_count = "3" %}

{% set name = "gromacs-metatomic" %}
{% set conda_version = "2026.0" %}

# Use a higher build number for preferred variants, to ensure that they are
# picked first by conda's solver, and installed where the platform supports it.
# Prefer: CUDA > non-CUDA, MPI > nompi, single > double
{% set build = 2 %}
{% set build = build + 100 %}  # [double == 'no' and cuda_compiler_version != "None"]
{% set build = build + 50 %}   # [mpi != 'nompi']

package:
  name: {{ name|lower }}
  version: {{ conda_version }}.mta{{ git_rev_count }}

source:
  # metatensor/gromacs metatomic branch tip (includes #13 sample_kind + floors).
  git_url: https://github.com/metatensor/gromacs.git
  git_rev: {{ git_rev }}
  depth: 1

build:
  number: {{ build }}
  string: >-
    nompi_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [mpi == 'nompi' and double == 'no' and cuda_compiler_version == "None"]
    mpi_{{ mpi }}_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [mpi != 'nompi' and double == 'no' and cuda_compiler_version == "None"]
    mpi_{{ mpi }}_cuda_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [mpi != 'nompi' and double == 'no' and cuda_compiler_version != "None"]
    nompi_dblprec_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [mpi == 'nompi' and double == 'yes' and cuda_compiler_version == "None"]
    mpi_{{ mpi }}_dblprec_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [mpi != 'nompi' and double == 'yes' and cuda_compiler_version == "None"]
    nompi_cuda_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [mpi == 'nompi' and double == 'no' and cuda_compiler_version != "None"]
  skip: true  # [win]
  skip: true  # [mpi == "openmpi" and arm64]
  skip: true  # [double == "yes" and cuda_compiler_version != "None"]

  # fails with: /usr/local/cuda/lib64/libcudart_static.a: error adding symbols: file in wrong format
  skip: true  # [(aarch64 or ppc64le) and double == "no" and cuda_compiler_version != "None"]

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - {{ compiler('cuda') }}  # [cuda_compiler_version != "None"]
    - {{ stdlib("c") }}
    - cmake >=3.28
    - pocl
    - perl
    - libgomp  # [linux]
    - llvm-openmp  # [osx]
    - coreutils  # [cuda_compiler_version != "None"]
    # Use individual CUDA packages instead of cuda-toolkit to avoid
    # cuda-gdb pulling in a conflicting Python version
    - cuda-cudart-dev  # [cuda_compiler_version != "None"]
    - cuda-driver-dev  # [cuda_compiler_version != "None"]
    - cuda-nvrtc-dev   # [cuda_compiler_version != "None"]
    - cuda-profiler-api  # [cuda_compiler_version != "None"]
    - libcufft-dev     # [cuda_compiler_version != "None"]
  host:
    - python
    - ocl-icd  # [linux and cuda_compiler_version == "None"]
    - cuda-cudart-dev  # [cuda_compiler_version != "None"]
    - cuda-driver-dev  # [cuda_compiler_version != "None"]
    - cuda-nvrtc-dev   # [cuda_compiler_version != "None"]
    - cuda-profiler-api  # [cuda_compiler_version != "None"]
    - libcufft-dev     # [cuda_compiler_version != "None"]
    - khronos-opencl-icd-loader  # [osx]
    - libhwloc 2.*
    - fftw
    # Flexible conda-forge BLAS/LAPACK. GROMACS links Fortran BLAS (daxpy_,
    # dgemm_, ...) into libgromacs. If FindBLAS is free and host libtorch is
    # cpu_mkl, it records DT_NEEDED on concrete vendor sonames (libmkl_* /
    # libopenblas), which break when a client re-pins the BLAS flavor.
    # Build against netlib so the ELF soname is libblas.so.3 / liblapack.so.3;
    # at install time the blas metapackage can select openblas, mkl, blis, …
    # (conda-forge knowledge base: BLAS).
    - libblas * *netlib
    - liblapack * *netlib
    - {{ mpi }}  # [mpi != 'nompi']
    - libmetatomic-torch >=0.1.15,<0.2.0
    - libmetatensor-torch >=0.10.0,<0.11.0
    - libmetatensor >=0.1.17,<0.3.0
    # Build against cpu_generic libtorch so host does not pull MKL (which would
    # fight the netlib libblas pin). The generic libtorch.so can still be
    # swapped for a CUDA build at runtime via the shared-object switch below.
    - libtorch * cpu_generic*
    - libtorch
  run:
    - python
    - ocl-icd  # [linux and cuda_compiler_version == "None"]
    - cuda-cudart  # [cuda_compiler_version != "None"]
    - khronos-opencl-icd-loader  # [osx]
    - ocl_icd_wrapper_apple  # [osx]
    - fftw
    - libhwloc 2.*
    # Flexible ABI; implementation chosen by the solver / client env.
    - libblas
    - liblapack
    - {{ mpi }}  # [mpi != 'nompi']
    - __cuda  # [not osx and cuda_compiler_version != "None"]
    - libmetatomic-torch >=0.1.15,<0.2.0
    - libmetatensor-torch >=0.10.0,<0.11.0
    - libmetatensor >=0.1.17,<0.3.0

test:
  commands:
    - gmx -version  # [mpi == 'nompi' and double == 'no']
    - gmx_d -version  # [mpi == 'nompi' and double == 'yes']
    - export OMPI_MCA_plm=isolated  # [mpi == "openmpi" and linux]
    - export OMPI_MCA_btl_vader_single_copy_mechanism=none  # [mpi == "openmpi" and linux]
    - export OMPI_MCA_rmaps_base_oversubscribe=yes  # [mpi == "openmpi" and linux]
    - gmx_mpi -version  # [mpi != 'nompi' and double == 'no']
    - gmx_mpi_d -version  # [mpi != 'nompi' and double == 'yes']:

about:
  home: https://docs.metatensor.org/metatomic/latest/engines/gromacs.html
  license: LGPL-2.1-or-later
  license_family: LGPL
  license_file: COPYING
  summary: 'Metatomic-enabled version of GROMACS'
  description: Metatomic-enabled version of GROMACS
  doc_url: https://docs.metatensor.org/metatomic/latest/engines/gromacs.html
  dev_url: https://github.com/metatensor/gromacs

extra:
  recipe-maintainers:
    - HaoZeke
    - Luthaf
    - PicoCentauri
