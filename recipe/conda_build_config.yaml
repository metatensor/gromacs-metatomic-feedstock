c_stdlib_version:            # [osx]
  - "11.0"                   # [osx]

cuda_compiler_version:   # [linux64]
  - None                 # [linux64]
  - 12.9                 # [linux64]

mpi:
  - openmpi
  - nompi
double:
  - no
  - yes

# Override conda-forge global pin (2.9). libmetatomic-torch 0.1.15
# requires libtorch >=2.12.1,<2.13 — same co-pin as eon-feedstock.
libtorch:
  - "2.12"

channel_targets:
  - metatensor main

channel_sources:
  - metatensor
  - conda-forge
